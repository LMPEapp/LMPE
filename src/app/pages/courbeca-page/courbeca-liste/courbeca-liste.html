<div class="courbeca-container" *ngIf="!isLoading; else loading">

  <mat-card *ngFor="let element of courbes" class="courbe-card mat-elevation-z2">

    <mat-card-header>
      <div mat-card-avatar *ngIf="element.userId; else webOrder">
        <app-avatar [url]="element.userUrlImage" [size]="40"></app-avatar>
      </div>
      <mat-card-title class="user">{{ element.userPseudo }}</mat-card-title>
      <mat-card-subtitle class="user">{{ element.userEmail }}</mat-card-subtitle>

      <ng-template #webOrder>
        <mat-card-title class="user">Commande Web</mat-card-title>
      </ng-template>

      <div class="date-amount">
        <div class="date">{{ element.datePointDateOnly.toLocaleString() }}</div>
        <div class="amount" [ngClass]="getAmountClass(element.amount)">
          {{ element.amount | shortNumber:2 }}€
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <div class="description-row">
        <div class="description" [innerHTML]="element.description"></div>
        <ng-container *ngIf="rightDelete(element)">
          <button mat-icon-button class="delete-btn" (click)="onDeleteMessage(element)">
          <mat-icon>delete</mat-icon>
        </button>
        </ng-container>
      </div>
    </mat-card-content>

  </mat-card>

  <div *ngIf="courbes.length === 0" class="no-data">
    Aucune donnée disponible.
  </div>

  <!-- Bouton charger plus -->
  <div class="load-more-container" *ngIf="courbes.length % 30 == 0 && courbes.length > 0">
    <button mat-stroked-button color="primary" (click)="loadMore()">Plus de données</button>
  </div>

</div>

<ng-template #loading>
  <div class="loading-container">
    <mat-progress-spinner diameter="50" mode="indeterminate"></mat-progress-spinner>
    <p>Chargement des données...</p>
  </div>
</ng-template>

<app-validation-dialog (closed)="onAlertClosed($event)"></app-validation-dialog>
