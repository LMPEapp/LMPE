<div class="message-wrapper"
     [ngClass]="{ mine: isMine, other: !isMine }"
     (pointerdown)="startPress($event)"
     (pointerup)="endPress()"
     (pointercancel)="cancelPress()"
     (touchmove)="cancelPress()"
     (mouseleave)="cancelPress()"
     (contextmenu)="$event.preventDefault()">

  <div class="message-card">
    <div *ngIf="user?.isAdmin || isMine" class="button-more">
      <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger" aria-label="Plus d'options">
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>

    <!-- ✅ Pastille affichée si message NON LU -->
    <div *ngIf="message.isRead" class="notification-badge">
      <!-- vide, ou icône, ou check -->
    </div>

    <mat-menu #menu="matMenu">
      <div class="menu">
        <button *ngIf="isMine" mat-menu-item (click)="onUpdate()">
          <mat-icon>edit</mat-icon>
          <span>Modifier</span>
        </button>
        <button mat-menu-item (click)="onDelete()">
          <mat-icon>delete</mat-icon>
          <span>Supprimer</span>
        </button>
      </div>
    </mat-menu>

    <div class="message-box">
      <div class="message-header">
        <app-avatar class="avatar" [url]="message.userUrlImage" [alt]="message.userPseudo" [size]="20"></app-avatar>
        <span class="date">{{ message.createdAt | myRelativeDate }}</span>
        <span class="pseudo">{{ isMine ? 'Moi' : message.userPseudo }}</span>
      </div>

      <div class="message-content">
        <span>{{ message.content }}</span>
      </div>
    </div>

  </div>
</div>
