<div class="message-wrapper" [ngClass]="{ mine: isMine, other: !isMine }">
  <div class="message-container">
    <!-- barre rapide -->
    <div *ngIf="showEmojiPopup"
        class="emoji-popup"
        tabindex="0"
        (blur)="closeEmojiPopup()"
        #popup
        [ngStyle]="{'top.px': popupTop, 'left.px': popupLeft}">
      <div class="quick-emojis">
        <span *ngFor="let emoji of quickEmojis" (click)="addReaction(emoji)">{{emoji}}</span>
        <span class="more" (click)="openFullEmojiPicker()">➕</span>
      </div>

      <div *ngIf="showFullPicker" class="full-emoji-picker">
        <div class="emoji-grid">
          <span *ngFor="let emoji of sortEmojisOther" (click)="addReaction(emoji)">{{emoji}}</span>
        </div>
      </div>
    </div>




    <div class="message-card"
         (pointerdown)="onPointerDown($event)"
         (pointerup)="onPointerUp()"
         (pointercancel)="cancelPress()"
         (touchmove)="cancelPress()"
         (mouseleave)="cancelPress()"
         (contextmenu)="$event.preventDefault()">

      <!-- Bouton plus d'options -->
      <div class="button-more">
        <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger" aria-label="Plus d'options">
          <mat-icon>more_vert</mat-icon>
        </button>
      </div>

      <!-- Pastille message lu -->
      <div *ngIf="message.isRead" class="notification-badge"></div>

      <mat-menu #menu="matMenu">
        <div class="menu">
          <button mat-menu-item (click)="openEmojiPopup()">
            <mat-icon>mood</mat-icon>
            <span>Reaction</span>
          </button>
          <button *ngIf="message.type=='texte'" mat-menu-item (click)="onCopier()">
            <mat-icon>content_copy</mat-icon>
            <span>Copier</span>
          </button>
          <button *ngIf="isMine && message.type=='texte'" mat-menu-item (click)="onUpdate()">
            <mat-icon>edit</mat-icon>
            <span>Modifier</span>
          </button>
          <button mat-menu-item *ngIf="message.type !== 'texte'" (click)="downloadFile()">
            <mat-icon>download</mat-icon>
            <span>Télécharger</span>
          </button>
          <button mat-menu-item class="delete-button" (click)="onDelete()">
            <mat-icon color="warn">delete</mat-icon>
            <span>Supprimer</span>
          </button>
        </div>
      </mat-menu>

      <!-- Contenu du message -->
      <div class="message-box">
        <div class="message-header">
          <app-avatar class="avatar" [url]="message.userUrlImage" [alt]="message.userPseudo" [size]="20"></app-avatar>
          <span class="pseudo">{{ isMine ? 'Moi' : message.userPseudo }}</span>
          <span class="date">{{ message.createdAt | myRelativeDate }}</span>
        </div>

        <div class="message-content">
          <ng-container *ngIf="message.type === 'texte'">
            <span class="text" [innerHTML]="formatMessageContent(message.content)"></span>
          </ng-container>
          <ng-container *ngIf="message.type === 'image'">
            <img [src]="getUrl()" alt="Image" class="message-media"/>
          </ng-container>
          <ng-container *ngIf="message.type === 'video'">
            <video class="message-media" controls [src]="getUrl()"></video>
          </ng-container>
          <ng-container *ngIf="message.type === 'fichier'">
            <mat-icon class="large-icon">insert_drive_file</mat-icon>
            <span class="text">{{ message.content }}</span>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Réactions -->
    <div class="message-reactions" *ngIf="message.reactions.length > 0">
      <div *ngFor="let reaction of message.reactions" class="item" (click)="onReactionClick(reaction)">
        <app-avatar class="avatar" [url]="reaction.userUrlImage" [alt]="reaction.userPseudo" [size]="20"></app-avatar>
        {{ reaction.emoji }}
      </div>
    </div>
  </div>
</div>
