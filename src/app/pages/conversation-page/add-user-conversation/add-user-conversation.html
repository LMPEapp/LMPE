<div *ngIf="isOpen"  class="overlay">
  <mat-card class="dialog">
    <h2>Ajout d'utilisateurs dans la conversation</h2>

    <p *ngIf="erreur">{{erreur}}</p>
    <div class="users-list">
      <div *ngFor="let u of users" class="user-row">
        <mat-checkbox
          [checked]="isUserInGroup(u.id) || listSelected.includes(u.id)"
          [disabled]="isUserInGroup(u.id)"
          (change)="toggleUserSelection(u.id)">
          <div class="label">
            <app-avatar [url]="u.urlImage" [alt]="u.pseudo" ></app-avatar>
            {{ u.pseudo }} ({{ u.email }})
          </div>
        </mat-checkbox>
      </div>
    </div>


    <div class="form-actions">
      <button mat-raised-button color="warn" type="button" (click)="onClose()">
        Annuler
      </button>
      <button mat-raised-button color="primary" type="button" (click)="onSubmit()">
        Valider
      </button>
    </div>
  </mat-card>

</div>
